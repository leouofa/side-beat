# ==============================================================================
# BLENDER MCP CHARACTER & FIGHTING-GAME RIGGING PIPELINE
# ==============================================================================
BLENDER_MCP_RIGGING:
  workflow_tool: "Blender MCP (execute_blender_code, look, get_scene_info)"
  visual_target: >
    Virtua Fighter / Indie Retro 3D low-poly arcade aesthetic: 800-2,000 triangles per
    playable fighter (1,200-3,200 triangles for bosses), sharp faceted normals,
    compact flat/vertex color palettes, exaggerated fighting proportions for unmistakable
    side-profile readability.
  skeleton_standard:
    base_humanoid_bones: 24
    hierarchy: >
      root -> hips -> spine_01 -> spine_02 -> chest -> neck -> head;
      clavicle.L/R -> upper_arm.L/R -> lower_arm.L/R -> hand.L/R -> weapon_socket.L/R;
      thigh.L/R -> shin.L/R -> foot.L/R -> toe.L/R; plus back_socket on chest.
    boss_rig_archetypes:
      gnome_trickster_chadzug: "0.55x compact stature on 24-bone rig with oversized pointed cap/beard mesh for clear silhouette + weapon_socket.R pickaxe"
      heavyweight_glutton_chupar: "1.35x wide sumo/brawler proportions (Virtua Fighter Taka-Arashi style) + belly_jiggle deform bone for elastic belly-deflect animations"
      avian_raptors_beebo_bar: "Base rig + wing_shoulder.L/R -> wing_mid.L/R -> wing_tip.L/R, talon_foot.L/R, and articulated beak_jaw"
      long_headed_bird_baba: "Tall lanky crane-stature rig + multi-segment neck_01 -> neck_02 -> elongated_cranium -> spear_beak_tip bone chain + crest_plume for half-screen whip-thrust pokes"
      bovine_gods_dadur_baphomet: "1.35x-1.50x Minotaur/Bovine rigs with broad hunch spine_02, horn.L/R gore sockets, and digitigrade hock/hoof.L/R"
      serpentine_naga_andruas: "Humanoid upper torso/arms fused to an 8-bone articulated snake coil chain (tail_01..tail_08) replacing legs + hood_flare.L/R & fang_jaw"
      insectoid_swarm_beezelbub: "Base rig + rapid-flutter dorsal_wing_upper.L/R & dorsal_wing_lower.L/R + mandible.L/R"
      infernal_triad_devil_satan_lucifer: "Whip-tail chain (tail_01..03) for Devil/Satan; 1.4x brute scale for Satan; 6-wing seraph rig (3 wing pairs on chest) for Lucifer"
    ik_setup_in_blender: >
      2-bone IK constraints on arms/legs (plus spline/damped-track chains on Andruas's
      serpent tail and Baba's elongated neck/cranium) for crisp planted stances and
      strike extension; baked to clean FK deform bones on GLB export (bake_anim_use_nla_strips=True).
  fighting_game_animation_spec:
    frame_rate: 60
    interpolation: "Stepped / crisp linear-snap keyposes with explicit Startup, Active, and Recovery frame windows"
