# ==============================================================================
# GAME SPECIFICATION INPUT — SIDE BEAT
# ==============================================================================
GAME_TITLE: "Side Beat"
GENRE_ARCHETYPE: "2.5D Belt-Scroller Beat 'Em Up / Arcade Tag-Morph Fighter"
CAMERA_PERSPECTIVE: >
  Side-Scrolling 2.5D Arcade Camera (FOV 50-55, pitched downward 12 deg, tracking X
  with smooth look-ahead, locked during "GO!" wave arenas and Boss showdowns; shallow
  Z-corridor [-3.2m, +3.2m] with characters locked to crisp left/right fighting stances)
TARGET_ENGINE: "Godot 4.7+ (Forward+ Renderer, Jolt 3D Physics)"

CORE_GAMEPLAY_LOOP: >
  Battle across a procedurally generated 7-stage Urban World Tour (New York City,
  Los Angeles, Madrid, Moscow, London, Tokyo, and Rome) in a crisp low-poly 3D
  arcade beat-'em-up. At any frame—including mid-string or mid-air—the player can
  zero-cooldown Shared-Soul Morph between four mythic gods (Endor, Ir, Osiris, and
  Horus) sharing a single health pool and chaining weapon stances and pantheon powers
  into freeform fighting-game combos. Clear "GO!" street wave arenas, smash urban
  props for pickups, and defeat 12 mythic bosses—Chadzug (Gnome God), Beebo (Bird God),
  Chupar (Overweight Humanoid God), Bar (Bird God), Dadur (Cow God), Baphomet (Cow God),
  Andruas (Snake God), Beezelbub (Fly God), Baba (Long-Headed Bird God), Devil, Satan,
  and Lucifer—set to a curated 37-track soundtrack.

KEY_MECHANICS:
  - Movement_2_5D: >
      Free X-axis horizontal run/walk, Y-axis jump and aerial juggle physics, and
      bounded Z-depth belt corridor (-3.2m to +3.2m) for flanking crowds and dodging
      boss AoEs while preserving strict left/right fighting-game facing.
  - Shared_Soul_Morph: >
      1 active god on-screen with a unified Shared HP Pool and Shared Pantheon Meter.
      Instant zero-cooldown morphing (Keys 1-4 / D-Pad / Shoulder Cycle) swaps mesh,
      weapon socket, hitbox profile, and moveset in-place while preserving velocity,
      airborne state, facing, and active combo counter.
  - Fighting_Game_Combat: >
      Light Attack (fast jab/poke), Heavy Attack (launcher/guard-crush), Pantheon
      Special (consumes Pantheon Charge), Directional Command Normals, Block/Perfect
      Parry, Grab/Throw, and Hitstop frame-freeze (3-7 frames) for arcade impact.
  - Cross_Pantheon_Resonance: >
      Chaining hits across multiple gods within a single combo builds Resonance Rank
      (D -> C -> B -> A -> S -> GODLIKE), boosting Pantheon Meter gain and score multiplier.
  - Urban_Interactables: >
      Destructible city props (fire hydrants, neon signs, cafe tables, metro barriers,
      arcade cabinets, street crates) drop street food heals, score gems, and meter orbs.

SCORING_AND_HIGH_SCORES:
  - Enemy_KO: Street Thugs (+250 pts), Bruisers/Enforcers (+600 pts), Cult Elites (+1,200 pts)
  - Boss_KO: Mid-Bosses Chadzug, Chupar, Dadur, Andruas, Baba (+6,000 pts each); Stage Bosses Beebo, Bar, Baphomet, Beezelbub, Devil, Satan (+10,000 pts each); Final Boss Lucifer (+25,000 pts)
  - Combo_And_Morph_Bonus: +50 pts per hit scaled by Cross-Pantheon Variety Multiplier (up to 4.0x when all 4 gods contribute to a combo)
  - Stage_Ranks: End-of-city arcade grading (C / B / A / S) based on clear time, max combo, damage taken, and stylish morph variety
  - Pickups: Score Bullion (+500 pts), Pantheon Sparks (+25% Special Meter), Street Feast (+30% Shared HP)
  - Persistence: Store top 10 arcade leaderboard, per-city best ranks, highest combo, and unlocked jukebox tracks in user://game_save.json

AUDIO_AND_VISUAL_THEME:
  - Aesthetic: >
      Crisp Low-Poly Arcade Fighter (Virtua Fighter / Tekken 2-3 / Indie Retro 3D)—flat
      and faceted shading, sharp geometric silhouettes, bold vertex/palette colors,
      contrasted against gritty stylized real-world urban streets.
  - Threat_vs_Reward_Hierarchy:
      - Player_Morph_Flashes: Asgardian Cyan-Blue (#00D4FF) for Endor, Olympian Gold-White (#FFE066) for Ir, Duat Emerald-Violet (#2CE8A2) for Osiris, Solar Amber-Crimson (#FF7A00) for Horus
      - Threats: Crimson (#FF1E42) ground telegraph zones, flash-red unblockable boss glints, high-contrast enemy rim outlines
      - Rewards: Healing pickups in Lush Jade (#32FF7E), Pantheon Energy in Royal Gold (#FFD700) with rotating low-poly halo rings
  - Audio: >
      Curated 37-track soundtrack in res://tracks/ mapped across the 7 City Stages,
      all 12 Bosses, and Menus with an arcade "Now Playing" HUD slide-in toast, crunchy
      retro arcade hit-sparks/impact SFX, and low-pass filter ducking on pause/KO slow-mo.

# ==============================================================================
# PLAYABLE PANTHEON ROSTER (SHARED-SOUL MORPH)
# ==============================================================================
CHARACTERS:
  morph_rules:
    shared_hp_pool: 1000
    shared_pantheon_meter_max: 100
    morph_cooldown_sec: 0.0
    morph_preserve_state: ["linear_velocity", "facing_direction", "is_on_floor", "combo_count", "hitstun_immunity_frames_2"]
  roster:
    - id: "endor"
      name: "Endor"
      pantheon: "Asgardian (Norse)"
      input_slot: 1
      archetype: "Heavy Armor-Breaker / Thunder Brawler"
      signature_weapon: "Runic War-Hammer & Thunder Gauntlets"
      color_palette: ["#00D4FF", "#1E3A5F", "#C8D6E5"]
      stats:
        move_speed: 5.2
        attack_speed_mult: 0.85
        damage_mult: 1.35
        poise_hyper_armor: "High (uninterruptible during heavy hammer swings)"
      pantheon_power:
        name: "Bifrost Storm"
        element: "Asgardian Thunder & Runic Shockwave"
        moves:
          - "Mjolnir Ground Shatter: AoE lightning shockwave along the Z-corridor that crumples blocking foes"
          - "Thunderclap Charge: Hyper-armor shoulder tackle followed by hammer uppercut wall-bounce"
          - "Asgard's Verdict (Super): Calls down pillars of Bifrost lightning across the locked arena"

    - id: "ir"
      name: "Ir"
      pantheon: "Greek (Olympian)"
      input_slot: 2
      archetype: "High-Speed Rushdown / Parry & Flash-Step Striker"
      signature_weapon: "Twin Olympic Blades & Aegis Cestus"
      color_palette: ["#FFE066", "#FFFFFF", "#2E5EAA"]
      stats:
        move_speed: 7.4
        attack_speed_mult: 1.30
        damage_mult: 0.90
        poise_hyper_armor: "Low (relies on frame-tight dashes and Aegis parries)"
      pantheon_power:
        name: "Olympian Radiance"
        element: "Arcane Light & Olympic Lightning"
        moves:
          - "Flash-Step Flurry: Teleporting 6-hit twin-blade slice string that crosses through enemies"
          - "Aegis Riposte: Instant counter-stance; parrying an attack triggers brief slow-mo and lightning stun"
          - "Wrath of Olympus (Super): Blinding prism barrage of light spears pinning enemies for morph follow-ups"

    - id: "osiris"
      name: "Osiris"
      pantheon: "Egyptian (Underworld / Duat)"
      input_slot: 3
      archetype: "Mid-Range Crowd Controller / Soul-Binder & Sustain"
      signature_weapon: "Spectral Crook & Flail"
      color_palette: ["#2CE8A2", "#6C3483", "#D4AC0D"]
      stats:
        move_speed: 5.8
        attack_speed_mult: 1.00
        damage_mult: 1.05
        poise_hyper_armor: "Medium"
      pantheon_power:
        name: "Duat Judgment"
        element: "Underworld Necromancy & Life-Force Drain"
        moves:
          - "Crook Vortex: Extended hook sweep that pulls scattered Z-lane enemies into a tight front cluster"
          - "Soul Harvest: Spectral flail spin that leeches HP from struck foes directly into the Shared HP Pool"
          - "Scales of Ma'at (Super): Erupts underworld obelisks and spectral hands that root all enemies on screen"

    - id: "horus"
      name: "Horus"
      pantheon: "Egyptian (Sky & Sun)"
      input_slot: 4
      archetype: "Aerial Juggler / Dive-Kick & Solar Lance Specialist"
      signature_weapon: "Winged Solar Spear & Falcon Talons"
      color_palette: ["#FF7A00", "#FFD700", "#8E1600"]
      stats:
        move_speed: 6.8
        attack_speed_mult: 1.15
        damage_mult: 1.00
        poise_hyper_armor: "Airborne Mobility (double jump + air-hover cancel)"
      pantheon_power:
        name: "Solar Falcon"
        element: "Solar Fire & Sky Wind"
        moves:
          - "Skyward Ascent: Rising winged-spear launcher that lifts targets into extended air-combo state"
          - "Falcon Meteor Dive: Steep 45-deg blazing talon dive-kick that ground-bounces enemies for Endor/Osiris pickups"
          - "Eye of Ra-Horakhty (Super): Hovering mid-air solar beam sweep scorching the entire street lane"

