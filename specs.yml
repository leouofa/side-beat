# ==============================================================================
# PROCEDURAL URBAN WORLD TOUR (7 CITY STAGES, 12 BOSS ENCOUNTERS)
# ==============================================================================
PROCEDURAL_LEVELS:
  progression_mode: "Stage-Based Urban World Tour (7 Procedural City Stages)"
  generation_algorithm:
    chunk_length_m: 24.0
    chunks_per_stage: [6, 8] # Entry -> Street Brawl -> Mid-Boss Arena (Stages 1-5) -> Plaza/Rooftop Brawl -> Stage Boss Arena
    corridor_depth_z_m: [-3.2, 3.2]
    lock_in_encounters: >
      3 to 4 "GO!" camera-lock battle zones per stage with procedural enemy wave budgets,
      flanking spawn doors/alleys/manholes, destructible urban props, Mid-Boss showdowns
      on Stages 1-5, and a climactic Stage Boss arena in all 7 cities.
  cities:
    - stage: 1
      city: "New York City"
      sub_biomes: ["Neon Times Square Crosswalk", "Graffiti Subway Platform", "Hell's Kitchen Rooftop"]
      hazards_and_props: ["Steam vents", "Yellow taxi barricades", "Fire hydrants (water knockback jet)"]
      mid_boss_id: "chadzug" # Gnome God
      stage_boss_id: "beebo" # Bird God
    - stage: 2
      city: "Los Angeles"
      sub_biomes: ["Venice Boardwalk Muscle Pit", "Sunset Palm Boulevard", "Downtown Overpass"]
      hazards_and_props: ["Arcade cabinets", "Palm planters", "Spotlight helicopters"]
      mid_boss_id: "chupar" # Overweight Humanoid God
      stage_boss_id: "bar" # Bird God
    - stage: 3
      city: "Madrid"
      sub_biomes: ["Sunlit Terracotta Courtyard", "Gran Via Cobblestone Avenue", "Plaza Mayor Arena"]
      hazards_and_props: ["Cafe tables & chairs", "Ornamental plaza fountains", "Wrought-iron lanterns"]
      mid_boss_id: "dadur" # Cow God
      stage_boss_id: "baphomet" # Cow God
    - stage: 4
      city: "Moscow"
      sub_biomes: ["Frozen Rail Conduit", "Snow-Swept Boulevard", "Red-Brick Constructivist Depot"]
      hazards_and_props: ["Ice slick patches", "Industrial oil drums (explosive)", "Armored freight containers"]
      mid_boss_id: "andruas" # Snake God
      stage_boss_id: "beezelbub" # Fly God
    - stage: 5
      city: "London"
      sub_biomes: ["Foggy Thames Embankment", "Soho Neon Alleyway", "Clocktower Courtyard"]
      hazards_and_props: ["Red phone booths", "Double-decker bus blockade", "Gaslight streetlamps"]
      mid_boss_id: "baba" # Long-Headed Bird God
      stage_boss_id: "devil"
    - stage: 6
      city: "Tokyo"
      sub_biomes: ["Shibuya Rain-Slicked Crossing", "Kabukicho Lantern Arcade", "Shinkansen Viaduct"]
      hazards_and_props: ["Vending machines", "Holographic signboards", "High-voltage transformer boxes"]
      mid_boss_id: null
      stage_boss_id: "satan"
    - stage: 7
      city: "Rome"
      sub_biomes: ["Floodlit Travertine Piazza", "Shattered Colosseum Avenue", "Eclipse Pantheon Steps"]
      hazards_and_props: ["Fallen marble columns", "Braziers of blue flame", "Fissured cobblestone rifts"]
      mid_boss_id: null
      stage_boss_id: "lucifer"

